-->
<section id="aba-instagram" class="hidden h-full overflow-y-auto pt-6 px-10 pb-10 max-md:px-4 max-md:pt-4 max-md:pb-7">
  <header class="flex items-center justify-between gap-4 mb-5">
    <div id="ig-subabas" class="flex gap-2 flex-wrap min-w-0" role="tablist" aria-label="Seções do Instagram"></div>
    <button
      type="button"
      id="ig-atualizar"
      class="shrink-0 inline-flex items-center gap-2 px-4 py-2 border border-linha rounded-full bg-superficie text-sm font-medium text-tinta transition-colors hover:border-cinza-claro focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-vekta disabled:opacity-45"
      title="Atualizar"
      aria-label="Atualizar"
    >
      <iconify-icon noobserver icon="lucide:refresh-cw" class="text-[15px]" aria-hidden="true"></iconify-icon>
      <span class="max-sm:hidden">Atualizar</span>
    </button>
  </header>

  <div id="ig-setup" class="hidden text-center py-16 px-6 text-cinza">
    <iconify-icon noobserver icon="lucide:instagram" class="text-4xl text-vekta mb-4" aria-hidden="true"></iconify-icon>
    <h2 class="font-display text-xl text-tinta mb-2">Instagram ainda não conectado</h2>
    <p class="text-base mb-3 max-w-xl mx-auto">
      Gere um Instagram User access token no App Dashboard da Meta
      (Instagram → API setup with Instagram business login → Generate token)
      e defina <code class="bg-vekta-suave text-vekta px-1.5 py-0.5 rounded-md font-mono text-[0.9em]">META_ACCESS_TOKEN</code>
      em <code class="bg-vekta-suave text-vekta px-1.5 py-0.5 rounded-md font-mono text-[0.9em]">interface/.env</code>.
    </p>
    <p class="text-sm text-cinza-claro">Reinicie a interface depois de salvar o token.</p>
  </div>

  <div id="ig-conteudo" class="hidden">
    <p id="ig-erro" class="hidden text-sm text-alerta mb-4" role="alert"></p>
    <div id="ig-painel-perfil" role="tabpanel"></div>
    <div id="ig-painel-metricas" class="hidden" role="tabpanel"></div>
    <div id="ig-painel-agendar" class="hidden" role="tabpanel"></div>
    <div id="ig-painel-automacao" class="hidden" role="tabpanel"></div>
  </div>
</section>
