<!--vekta-pagina
{ "titulo": "Agenda", "icone": "lucide:calendar", "ordem": 58 }
-->
<section
  id="aba-agenda"
  class="hidden flex flex-col h-full min-h-0 overflow-hidden"
>
  <div
    class="flex-1 min-h-0 overflow-y-auto pt-6 px-10 pb-10 max-md:px-4 max-md:pt-4 max-md:pb-7"
  >
    <header class="flex items-end justify-between gap-4 mb-5 max-md:flex-col max-md:items-start">
      <div>
        <p
          id="ag-origem"
          class="font-mono text-xs uppercase tracking-widest text-vekta mb-1.5"
        >
          agenda
        </p>
        <h1 class="font-display text-3xl font-semibold tracking-tight">
          Agenda
        </h1>
      </div>
      <div id="ag-acoes" class="flex flex-wrap items-center gap-2">
        <button
          type="button"
          id="ag-hoje"
          class="inline-flex items-center gap-2 px-4 py-2 border border-linha rounded-full bg-superficie text-sm font-medium text-tinta transition-colors hover:border-cinza-claro focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-vekta disabled:opacity-45"
        >
          Hoje
        </button>
        <button
          type="button"
          id="ag-novo"
          class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-vekta border border-vekta text-white text-sm font-medium transition-colors hover:bg-vekta-escuro hover:border-vekta-escuro focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-vekta disabled:opacity-45"
        >
          <iconify-icon
            noobserver
            icon="lucide:plus"
            class="text-[15px]"
            aria-hidden="true"
          ></iconify-icon>
          Novo evento
        </button>
        <button
          type="button"
          id="ag-atualizar"
          class="inline-flex items-center gap-2 px-4 py-2 border border-linha rounded-full bg-superficie text-sm font-medium text-tinta transition-colors hover:border-cinza-claro focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-vekta disabled:opacity-45"
          title="Atualizar"
          aria-label="Atualizar"
        >
          <iconify-icon
            noobserver
            icon="lucide:refresh-cw"
            class="text-[15px]"
            aria-hidden="true"
          ></iconify-icon>
          <span class="max-sm:hidden">Atualizar</span>
        </button>
      </div>
    </header>

    <div id="ag-painel">
      <div
        class="flex items-center justify-between gap-3 mb-4 flex-wrap"
      >
        <div class="flex items-center gap-2">
          <button
            type="button"
            id="ag-mes-ant"
            class="inline-flex items-center justify-center w-9 h-9 rounded-full border border-linha bg-superficie text-tinta transition-colors hover:border-cinza-claro focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-vekta"
            title="Mês anterior"
            aria-label="Mês anterior"
          >
            <iconify-icon
              noobserver
              icon="lucide:chevron-left"
              class="text-lg"
              aria-hidden="true"
            ></iconify-icon>
          </button>
          <h2
            id="ag-mes-titulo"
            class="font-display text-xl font-semibold tracking-tight min-w-[10rem] text-center"
          ></h2>
          <button
            type="button"
            id="ag-mes-prox"
            class="inline-flex items-center justify-center w-9 h-9 rounded-full border border-linha bg-superficie text-tinta transition-colors hover:border-cinza-claro focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-vekta"
            title="Próximo mês"
            aria-label="Próximo mês"
          >
            <iconify-icon
              noobserver
              icon="lucide:chevron-right"
              class="text-lg"
              aria-hidden="true"
            ></iconify-icon>
          </button>
        </div>
        <p id="ag-status" class="text-sm text-cinza"></p>
      </div>

      <div
        id="ag-grade"
        class="bg-superficie border border-linha rounded-2xl overflow-hidden shadow-sm"
      ></div>
    </div>
  </div>
</section>
