# Painel da clínica (Vue) — https://clinica.vektaai.com.br
# Upstream: container frontend em 127.0.0.1:8181 (docker-compose.prod.yml)
#
# 1) Ativar (HTTP primeiro — sem certificado ainda):
#   sudo cp deploy/nginx/clinica.vektaai.com.br.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/clinica.vektaai.com.br.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 2) Emitir certificado (DNS já deve apontar para a VPS):
#   sudo certbot --nginx -d clinica.vektaai.com.br
#
# Não referencie fullchain.pem antes do passo 2 — o nginx falha ao recarregar.
# Upstream clinica_app: nome único nesta VPS.

upstream clinica_app {
    server 127.0.0.1:8181;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name clinica.vektaai.com.br;

    client_max_body_size 32m;

    location / {
        proxy_pass http://clinica_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
