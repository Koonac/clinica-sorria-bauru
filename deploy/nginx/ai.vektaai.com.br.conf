# Vekta AI — https://ai.vektaai.com.br
# Upstream: processo no host / systemd vekta-ai (127.0.0.1:4680)
#
# 1) Ativar (HTTP primeiro — sem certificado ainda):
#   sudo cp deploy/nginx/ai.vektaai.com.br.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/ai.vektaai.com.br.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 2) Emitir certificado (Certbot altera este arquivo e adiciona HTTPS):
#   sudo certbot --nginx -d ai.vektaai.com.br
#
# Não referencie fullchain.pem antes do passo 2 — o nginx falha ao recarregar.

upstream vekta_ai {
    server 127.0.0.1:4680;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ai.vektaai.com.br;

    client_max_body_size 80m;

    location / {
        proxy_pass http://vekta_ai;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
