# Vekta AI da clínica — https://aiclinica.vektaai.com.br
# Upstream: systemd clinica-ai (127.0.0.1:4780)
#
# 1) Ativar (HTTP primeiro — sem certificado ainda):
#   sudo cp deploy/nginx/aiclinica.vektaai.com.br.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/aiclinica.vektaai.com.br.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 2) Emitir certificado (Certbot altera este arquivo e adiciona HTTPS):
#   sudo certbot --nginx -d aiclinica.vektaai.com.br
#
# Não referencie fullchain.pem antes do passo 2 — o nginx falha ao recarregar.
# Upstream clinica_ai: nome único nesta VPS (não reutilizar vekta_ai).

upstream clinica_ai {
    server 127.0.0.1:4780;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name aiclinica.vektaai.com.br;

    client_max_body_size 80m;

    location / {
        proxy_pass http://clinica_ai;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
