# Stack central: Backend (Postgres) + WhatsApp API (rede vekta-network)
#
# A interface Vekta AI roda no HOST (não neste compose):
#   cd "Vekta AI/interface"; npm install; npm run start
#   → http://localhost:4680
#
# Pré-requisitos:
#   1. Whatsapp-api/.env          (copie de Whatsapp-api/.env.example)
#   2. "Vekta AI/interface/.env"  (copie de .env.example e preencha login web)
#   3. Claude CLI no PATH (`npm i -g @anthropic-ai/claude-code`) e autenticado (`claude`)
#
# Uso:
#   docker compose up -d --build
#
# URLs:
#   Postgres:        localhost:5432  (Laravel no host)
#   WhatsApp API:    http://localhost:3000
#   Vekta interface: http://localhost:4680  (host — npm run start / npm run dev)

name: vekta

services:
  # --- Backend (Laravel API — roda no host; aqui só o banco) ---
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vekta_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vekta_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vekta-network

  # --- WhatsApp API ---
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Evita crash em loop: Failed to unlink /tmp/mongodb-27017.sock (Operation not permitted)
    tmpfs:
      - /tmp
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - vekta-network

  wwebjs:
    build: ./Whatsapp-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - ./Whatsapp-api/.env
    environment:
      PORT: "3000"
      MONGODB_URI: mongodb://mongo:27017/whatsapp-sessions
      NODE_ENV: production
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - sessions_data:/app/sessions
      - ./Whatsapp-api/.env:/app/.env:ro
    networks:
      - vekta-network

networks:
  vekta-network:
    name: vekta-network

volumes:
  postgres-data:
  mongo_data:
  sessions_data:
