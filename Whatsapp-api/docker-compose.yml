services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Evita crash em loop: Failed to unlink /tmp/mongodb-27017.sock (Operation not permitted)
    tmpfs:
      - /tmp
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - internal

  wwebjs:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
      MONGODB_URI: mongodb://mongo:27017/whatsapp-sessions
      NODE_ENV: production
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - sessions_data:/app/sessions
      - ./.env:/app/.env:ro
    networks:
      - internal
      - vekta-network

networks:
  internal:
  vekta-network:
    external: true
    name: vekta-network


volumes:
  mongo_data:
  sessions_data:
