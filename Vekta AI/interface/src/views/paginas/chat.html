<!--vekta-pagina
{ "titulo": "Chat", "icone": "lucide:message-circle", "ordem": 10, "principal": true }
-->
<section id="aba-chat" class="hidden flex flex-col h-full min-h-0 pt-8.5 px-10 pb-6 max-md:px-4 max-md:pt-5">
  <!-- Slot central: recebe #chat-host quando a aba Chat está ativa.
       O mesmo host migra para #chat-slot-ide na Visão geral (ver chat.js → alojar). -->
  <div id="chat-slot-central" class="flex flex-col flex-1 min-h-0 min-w-0">
    <div id="chat-host" class="chat-host flex flex-col flex-1 min-h-0 min-w-0" data-modo="central">

      <header class="chat-cabecalho shrink-0 flex items-end justify-between gap-6 mb-6.5 max-md:flex-col max-md:items-start max-md:gap-2">
        <div class="chat-titulo min-w-0">
          <p class="chat-eyebrow font-mono text-xs uppercase tracking-widest text-vekta mb-1.5">conversa com o Vekta</p>
          <h1 class="font-display text-3xl font-semibold tracking-tight">Chat</h1>
        </div>
        <div class="relative flex items-center gap-2.5">
          <span id="chat-sessao" class="font-mono text-xs text-cinza-claro"></span>
          <button id="botao-nova-conversa" type="button" class="chat-btn-nova inline-flex items-center gap-2 px-4 py-2 border border-linha rounded-full bg-superficie text-sm font-medium text-tinta transition-colors hover:border-cinza-claro focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-vekta">
            <iconify-icon noobserver icon="lucide:plus" class="chat-btn-nova-icone hidden text-[15px]" aria-hidden="true"></iconify-icon>
            <span class="chat-btn-nova-texto">Nova conversa</span>
          </button>
          <button id="botao-historico" type="button" title="Conversas anteriores" aria-label="Conversas anteriores" aria-expanded="false" aria-controls="chat-historico" class="inline-flex items-center justify-center w-10 h-10 border border-linha rounded-full bg-superficie text-tinta transition-colors hover:border-cinza-claro focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-vekta data-[aberto]:border-vekta data-[aberto]:text-vekta data-[aberto]:bg-vekta-suave">
            <iconify-icon noobserver icon="lucide:history" class="text-[20px]" aria-hidden="true"></iconify-icon>
          </button>

          <aside id="chat-historico" hidden class="chat-historico fixed z-50 flex flex-col rounded-2xl border border-linha bg-superficie shadow-xl overflow-hidden">
            <div class="flex items-center justify-between gap-2 px-4 py-3 border-b border-linha">
              <h2 class="font-display text-sm font-semibold tracking-tight">Conversas</h2>
              <button type="button" id="botao-fechar-historico" title="Fechar" aria-label="Fechar histórico" class="inline-flex items-center justify-center w-8 h-8 rounded-full text-cinza transition-colors hover:bg-fundo hover:text-tinta focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-vekta">
                <iconify-icon noobserver icon="lucide:x" class="text-[18px]" aria-hidden="true"></iconify-icon>
              </button>
            </div>
            <div id="chat-historico-lista" class="flex-1 overflow-y-auto p-2 flex flex-col gap-1"></div>
          </aside>
        </div>
      </header>

      <!-- Modal: breakdown da janela de contexto (estilo /context) -->
      <div id="chat-contexto-modal" hidden class="fixed inset-0 z-50 flex items-center justify-center p-6 max-md:p-3 bg-black/55 backdrop-blur-sm" role="dialog" aria-modal="true" aria-labelledby="chat-contexto-titulo">
        <div class="w-full max-w-md rounded-2xl border border-linha bg-superficie shadow-2xl overflow-hidden">
          <header class="flex items-center justify-between gap-3 px-5 py-3.5 border-b border-linha">
            <h2 id="chat-contexto-titulo" class="font-display text-sm font-semibold tracking-tight">Uso do contexto</h2>
            <button type="button" id="chat-contexto-fechar" aria-label="Fechar" class="inline-flex items-center justify-center w-8 h-8 rounded-full text-cinza transition-colors hover:bg-fundo hover:text-tinta focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-vekta">
              <iconify-icon noobserver icon="lucide:x" class="text-[18px]" aria-hidden="true"></iconify-icon>
            </button>
          </header>
          <div id="chat-contexto-corpo" class="px-5 py-4 max-h-[70vh] overflow-y-auto">
            <p class="text-sm text-cinza">Carregando…</p>
          </div>
        </div>
      </div>

      <div class="chat-corpo flex flex-1 min-h-0">
        <div class="flex flex-col flex-1 min-w-0 min-h-0">
          <div id="chat-rolagem" class="flex-1 overflow-y-auto mx-[-12px] px-3">
            <div id="chat-mensagens" class="max-w-220 mx-auto min-h-full flex flex-col gap-4 pb-3">
              <div id="chat-boasvindas" class="flex-1 flex flex-col items-center justify-center text-center px-5 text-cinza">
                <div class="relative z-10 flex flex-col items-center">
                  <div class="orbe-anel orbe-anel--grande relative w-16 h-16 mb-4 rounded-full"></div>
                  <h2 class="font-display text-xl text-tinta mb-1.5">O que vamos fazer hoje?</h2>
                  <p id="chat-boasvindas-texto" class="text-base mb-2">Digite e o Vekta Ai coloca em movimento.</p>
                </div>
                <div id="chat-form-espaco" class="w-full"></div>
              </div>
            </div>
          </div>

          <div id="chat-composer" class="chat-composer shrink-0 flex flex-col gap-1.5 max-w-220 w-full mx-auto mt-4">
            <!-- Limites do plano: fora da caixa, logo acima do input -->
            <div id="chat-limites" class="chat-limites flex items-center gap-2 px-1" hidden aria-live="polite">
              <div class="flex items-center gap-1.5 flex-1 min-w-0" title="Limite da sessão (~5 horas)">
                <span class="font-mono text-[9px] uppercase tracking-wider text-cinza-claro shrink-0">5h</span>
                <div class="flex-1 h-0.5 min-w-6 rounded-full bg-linha overflow-hidden">
                  <div id="chat-limite-sessao-barra" class="h-full rounded-full bg-vekta transition-[width] duration-500 ease-out" style="width:0%"></div>
                </div>
                <span id="chat-limite-sessao-pct" class="font-mono text-[10px] text-cinza-claro tabular-nums w-7 text-right shrink-0">—</span>
              </div>
              <div class="flex items-center gap-1.5 flex-1 min-w-0" title="Limite semanal (todos os modelos)">
                <span class="font-mono text-[9px] uppercase tracking-wider text-cinza-claro shrink-0">7d</span>
                <div class="flex-1 h-0.5 min-w-6 rounded-full bg-linha overflow-hidden">
                  <div id="chat-limite-semanal-barra" class="h-full rounded-full bg-vekta/70 transition-[width] duration-500 ease-out" style="width:0%"></div>
                </div>
                <span id="chat-limite-semanal-pct" class="font-mono text-[10px] text-cinza-claro tabular-nums w-7 text-right shrink-0">—</span>
              </div>
              <button type="button" id="chat-contexto-ajuda" title="Janela de contexto" aria-label="Ver janela de contexto" class="inline-flex items-center justify-center w-5 h-5 shrink-0 rounded-full text-cinza-claro text-[10px] font-medium leading-none transition-colors hover:text-tinta focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-vekta">?</button>
            </div>

            <form id="chat-form" class="chat-caixa relative flex flex-col gap-2 w-full bg-superficie border border-linha rounded-[26px] pl-3 py-3 pr-2.5 transition-colors focus-within:border-vekta">
              <button type="button" id="chat-ir-fim" hidden title="Ir para as mensagens mais recentes" aria-label="Ir para o fim" class="absolute -top-12 left-1/2 -translate-x-1/2 z-10 inline-flex items-center justify-center w-9 h-9 rounded-full bg-superficie border border-linha text-tinta shadow-md transition-colors hover:border-cinza-claro hover:text-vekta focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-vekta">
                <iconify-icon noobserver icon="lucide:arrow-down" class="text-[18px] block" aria-hidden="true"></iconify-icon>
              </button>
              <div id="chat-drop-overlay" class="hidden absolute inset-0 z-20 items-center justify-center gap-2 rounded-[26px] border-2 border-dashed border-vekta bg-superficie/95 backdrop-blur-sm pointer-events-none">
                <iconify-icon noobserver icon="lucide:file-up" class="text-[20px] text-vekta" aria-hidden="true"></iconify-icon>
                <span class="font-medium text-vekta">Solte o arquivo aqui</span>
              </div>
              <div id="chat-anexos" class="hidden flex-wrap gap-2 px-2.5"></div>
              <div class="flex gap-2 items-end">
                <input type="file" id="chat-arquivo-imagem" accept="image/png,image/jpeg,image/webp,image/gif,application/pdf,text/plain,.pdf,.txt" multiple class="hidden">
                <button type="button" id="chat-anexar" title="Anexar arquivo (imagem, PDF ou .txt)" aria-label="Anexar arquivo" class="inline-flex items-center justify-center w-10 h-10 shrink-0 rounded-full text-cinza transition-colors hover:bg-fundo hover:text-tinta focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-vekta">
                  <iconify-icon noobserver icon="lucide:paperclip" class="text-[19px]" aria-hidden="true"></iconify-icon>
                </button>
                <textarea id="chat-entrada" rows="1" placeholder="Escreva para o Vekta Ai…" autocomplete="off" class="flex-1 border-0 resize-none bg-transparent font-sans text-lg text-tinta max-h-48 leading-normal py-2 focus:outline-none"></textarea>
                <button type="button" id="chat-microfone" hidden title="Ditar por voz" aria-label="Ditar por voz" aria-pressed="false" class="inline-flex items-center justify-center rounded-full bg-vekta border border-vekta text-white w-11 h-11 shrink-0 transition-colors hover:bg-vekta-escuro hover:border-vekta-escuro focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-vekta data-[gravando]:bg-alerta data-[gravando]:border-alerta data-[gravando]:hover:bg-alerta">
                  <iconify-icon noobserver icon="lucide:mic" class="text-[20px] block" aria-hidden="true"></iconify-icon>
                </button>
                <button type="submit" id="chat-enviar" hidden title="Enviar (Enter)" aria-label="Enviar mensagem" data-modo="enviar" class="chat-btn-enviar inline-flex items-center justify-center rounded-full bg-vekta border border-vekta text-white w-11 h-11 shrink-0 transition-colors hover:bg-vekta-escuro hover:border-vekta-escuro focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-vekta disabled:opacity-45 disabled:cursor-default">
                  <iconify-icon id="chat-enviar-icone" noobserver icon="lucide:arrow-up" class="text-[20px] block" aria-hidden="true"></iconify-icon>
                  <span id="chat-enviar-stop" hidden class="block w-3.5 h-3.5 rounded-[2px] bg-current" aria-hidden="true"></span>
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
