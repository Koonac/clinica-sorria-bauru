<!--vekta-pagina
{ "titulo": "CRM", "icone": "lucide:contact", "ordem": 60 }
-->
<section id="aba-crm" class="hidden flex flex-col h-full min-h-0 overflow-hidden">
  <div
    class="flex flex-col flex-1 min-h-0 pt-6 px-10 pb-6 max-md:px-4 max-md:pt-4 max-md:pb-4"
  >
    <header
      class="shrink-0 flex items-end justify-between gap-4 mb-5 max-md:flex-col max-md:items-start"
    >
      <div>
        <p class="font-mono text-xs uppercase tracking-widest text-vekta mb-1.5">
          vendas
        </p>
        <h1 class="font-display text-3xl font-semibold tracking-tight">CRM</h1>
      </div>
      <div id="crm-acoes" class="hidden flex flex-wrap items-center gap-2">
        <div
          class="inline-flex items-center rounded-full border border-linha bg-superficie p-1"
          role="tablist"
          aria-label="Visualização do CRM"
        >
          <button
            type="button"
            id="crm-ver-dashboard"
            role="tab"
            class="px-3.5 py-1.5 rounded-full text-sm font-medium transition-colors"
          >
            Dashboard
          </button>
          <button
            type="button"
            id="crm-ver-leads"
            role="tab"
            class="px-3.5 py-1.5 rounded-full text-sm font-medium transition-colors"
          >
            Leads
          </button>
          <button
            type="button"
            id="crm-ver-negocios"
            role="tab"
            class="px-3.5 py-1.5 rounded-full text-sm font-medium transition-colors"
          >
            Negócios
          </button>
          <button
            type="button"
            id="crm-ver-contatos"
            role="tab"
            class="px-3.5 py-1.5 rounded-full text-sm font-medium transition-colors"
          >
            Contatos
          </button>
        </div>
        <button
          type="button"
          id="crm-novo-lead"
          class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-vekta border border-vekta text-white text-sm font-medium transition-colors hover:bg-vekta-escuro hover:border-vekta-escuro focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-vekta disabled:opacity-45"
        >
          <iconify-icon
            noobserver
            icon="lucide:plus"
            class="text-[15px]"
            aria-hidden="true"
          ></iconify-icon>
          Novo lead
        </button>
        <button
          type="button"
          id="crm-atualizar"
          class="inline-flex items-center gap-2 px-4 py-2 border border-linha rounded-full bg-superficie text-sm font-medium text-tinta transition-colors hover:border-cinza-claro focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-vekta disabled:opacity-45"
          title="Atualizar"
          aria-label="Atualizar"
        >
          <iconify-icon
            noobserver
            icon="lucide:refresh-cw"
            class="text-[15px]"
            aria-hidden="true"
          ></iconify-icon>
          <span class="max-sm:hidden">Atualizar</span>
        </button>
      </div>
    </header>

    <div
      id="crm-setup"
      class="hidden flex-1 min-h-0 overflow-y-auto text-center py-16 px-6 text-cinza"
    >
      <iconify-icon
        noobserver
        icon="lucide:database-zap"
        class="text-4xl text-vekta mb-4"
        aria-hidden="true"
      ></iconify-icon>
      <h2 class="font-display text-xl text-tinta mb-2">
        Backend do CRM ainda não configurado
      </h2>
      <p class="text-base mb-3 max-w-xl mx-auto">
        Suba o backend Laravel (<code
          class="bg-vekta-suave text-vekta px-1.5 py-0.5 rounded-md font-mono text-[0.9em]"
          >backend/</code
        >), rode
        <code
          class="bg-vekta-suave text-vekta px-1.5 py-0.5 rounded-md font-mono text-[0.9em]"
          >php artisan migrate --seed</code
        >
        e defina no
        <code
          class="bg-vekta-suave text-vekta px-1.5 py-0.5 rounded-md font-mono text-[0.9em]"
          >interface/.env</code
        >:
      </p>
      <ul
        class="text-left inline-block text-sm space-y-1.5 mb-2 font-mono text-tinta"
      >
        <li>BACKEND_URL</li>
        <li>BACKEND_API_TOKEN</li>
      </ul>
    </div>

    <div id="crm-painel" class="hidden flex flex-col flex-1 min-h-0">
      <p id="crm-status" class="shrink-0 text-sm text-cinza mb-4"></p>

      <div
        id="crm-vista-dashboard"
        class="hidden flex-1 min-h-0 overflow-y-auto"
      >
        <div
          id="crm-dashboard-kpis"
          class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 mb-5"
        ></div>
        <div
          id="crm-dashboard-leads-chart"
          class="bg-superficie border border-linha rounded-2xl shadow-sm overflow-hidden mb-5"
        ></div>
        <div
          id="crm-dashboard-pipelines"
          class="grid grid-cols-1 lg:grid-cols-2 gap-5 mb-5"
        >
          <div
            id="crm-dashboard-pipeline-leads"
            class="bg-superficie border border-linha rounded-2xl shadow-sm overflow-hidden min-w-0"
          ></div>
          <div
            id="crm-dashboard-pipeline-deals"
            class="bg-superficie border border-linha rounded-2xl shadow-sm overflow-hidden min-w-0"
          ></div>
        </div>
        <div
          id="crm-dashboard-funil"
          class="bg-superficie border border-linha rounded-2xl shadow-sm overflow-hidden mb-5"
        ></div>
        <div
          id="crm-dashboard-estagios"
          class="bg-superficie border border-linha rounded-2xl shadow-sm overflow-hidden"
        ></div>
      </div>

      <div id="crm-vista-leads" class="hidden flex-1 min-h-0 flex flex-col">
        <div class="flex flex-wrap items-center gap-3 mb-4 shrink-0">
          <label class="relative flex-1 min-w-[12rem] max-w-md">
            <span class="sr-only">Buscar leads</span>
            <iconify-icon
              noobserver
              icon="lucide:search"
              class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-cinza text-[15px]"
              aria-hidden="true"
            ></iconify-icon>
            <input
              type="search"
              id="crm-leads-busca"
              placeholder="Buscar por nome, e-mail, telefone ou empresa…"
              class="w-full rounded-xl border border-linha bg-fundo pl-9 pr-3 py-2 text-sm text-tinta focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-vekta"
              autocomplete="off"
            />
          </label>
        </div>
        <div
          id="crm-kanban-leads"
          class="flex-1 min-h-0 flex gap-3 items-stretch overflow-x-auto pb-1"
        ></div>
      </div>

      <div id="crm-vista-negocios" class="hidden flex-1 min-h-0 flex flex-col">
        <div class="flex flex-wrap items-center gap-3 mb-4 shrink-0">
          <label class="relative flex-1 min-w-[12rem] max-w-md">
            <span class="sr-only">Buscar negócios</span>
            <iconify-icon
              noobserver
              icon="lucide:search"
              class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-cinza text-[15px]"
              aria-hidden="true"
            ></iconify-icon>
            <input
              type="search"
              id="crm-negocios-busca"
              placeholder="Buscar por título, contato ou empresa…"
              class="w-full rounded-xl border border-linha bg-fundo pl-9 pr-3 py-2 text-sm text-tinta focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-vekta"
              autocomplete="off"
            />
          </label>
        </div>
        <div
          id="crm-kanban-negocios"
          class="flex-1 min-h-0 flex gap-3 items-stretch overflow-x-auto pb-1"
        ></div>
      </div>

      <div
        id="crm-vista-contatos"
        class="hidden flex-1 min-h-0 overflow-y-auto flex flex-col"
      >
        <div class="flex flex-wrap items-center gap-3 mb-4 shrink-0">
          <label class="relative flex-1 min-w-[12rem] max-w-md">
            <span class="sr-only">Buscar contatos</span>
            <iconify-icon
              noobserver
              icon="lucide:search"
              class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-cinza text-[15px]"
              aria-hidden="true"
            ></iconify-icon>
            <input
              type="search"
              id="crm-contatos-busca"
              placeholder="Buscar por nome, e-mail ou telefone…"
              class="w-full rounded-xl border border-linha bg-fundo pl-9 pr-3 py-2 text-sm text-tinta focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-vekta"
              autocomplete="off"
            />
          </label>
        </div>
        <div
          id="crm-contatos-lista"
          class="bg-superficie border border-linha rounded-2xl shadow-sm overflow-hidden"
        ></div>
      </div>

    </div>
  </div>
</section>
