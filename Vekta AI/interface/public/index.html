<!doctype html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vekta Ai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <!-- CSS gerado em build/watch por @tailwindcss/cli a partir de src/styles/tailwind.css
       (que contém os tokens de marca em @theme) — ver npm run css:build / css:watch. -->
  <link rel="stylesheet" href="/css/tailwind.css" />
  <!-- Base do Slim Select (vendorizada). Vem antes de app.css, que aplica o tema Vekta por cima. -->
  <link rel="stylesheet" href="/vendor/slimselect.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <script src="/vendor/lucide-preload.js"></script>
  <script src="/vendor/iconify-icon.min.js"></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%230A0B0F'/%3E%3Ccircle cx='16' cy='16' r='10.5' fill='none' stroke='%230E8A76' stroke-width='3'/%3E%3C/svg%3E" />
</head>
<body class="h-full flex flex-col md:flex-row bg-fundo text-tinta font-sans text-base leading-normal antialiased">

  <!-- Glow ambiente atrás do conteúdo (persegue o cursor; ver initCursor em app.js) -->
  <div id="cursor-glow" class="cursor-glow" aria-hidden="true"></div>

  <!-- Header só no mobile: hambúrguer + marca (evita sobrepor o conteúdo das páginas). -->
  <header id="topo-mobile" class="topo-mobile relative z-20 flex shrink-0 items-center gap-3 border-b border-linha bg-superficie px-4 h-16 md:hidden">
    <button type="button" id="botao-menu" class="inline-flex items-center justify-center w-11 h-11 shrink-0 rounded-xl border border-linha text-tinta transition-colors hover:bg-fundo hover:border-cinza-claro focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-vekta" title="Menu" aria-label="Abrir menu" aria-expanded="false" aria-controls="rail">
      <iconify-icon noobserver icon="lucide:menu" class="text-[22px] botao-menu-icone-abrir" aria-hidden="true"></iconify-icon>
      <iconify-icon noobserver icon="lucide:x" class="hidden text-[22px] botao-menu-icone-fechar" aria-hidden="true"></iconify-icon>
    </button>
    <img src="/raw/.dna/logos/logo-mark.png" alt="Logo Vekta Ai" class="w-9 h-9 shrink-0 object-contain" title="Vekta Ai" />
    <strong class="font-display text-base font-semibold tracking-tight truncate">Vekta Ai</strong>
  </header>

  <aside id="rail" class="group/rail relative z-20 flex h-full shrink-0 flex-col border-r border-linha bg-superficie" aria-label="Navegação">
    <div class="rail-topo flex items-center gap-3 shrink-0 px-4 py-4 border-b border-linha min-h-[4.5rem]">
      <img id="orbe" src="/raw/.dna/logos/logo-mark.png" alt="Logo Vekta Ai" class="w-10 h-10 shrink-0 object-contain" title="Vekta Ai" />
      <div class="rail-marca flex flex-col leading-none min-w-0 flex-1">
        <strong class="font-display text-lg font-semibold tracking-tight truncate">Vekta Ai</strong>
        <span id="orbe-status" class="text-xs text-vekta transition-colors mt-1">Vekta ativo</span>
      </div>
      <button type="button" id="botao-recolher" class="hidden md:inline-flex items-center justify-center w-9 h-9 shrink-0 rounded-lg border border-linha text-cinza transition-colors hover:bg-fundo hover:text-tinta hover:border-cinza-claro focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-vekta" title="Recolher menu" aria-label="Recolher menu" aria-expanded="true" aria-controls="rail">
        <iconify-icon noobserver icon="lucide:panel-left-close" class="text-[18px] group-data-[recolhida]/rail:hidden" aria-hidden="true"></iconify-icon>
        <iconify-icon noobserver icon="lucide:panel-left-open" class="hidden text-[18px] group-data-[recolhida]/rail:inline-block" aria-hidden="true"></iconify-icon>
      </button>
      <button type="button" id="botao-fechar-menu" class="inline-flex md:hidden items-center justify-center w-9 h-9 shrink-0 rounded-lg border border-linha text-cinza transition-colors hover:bg-fundo hover:text-tinta hover:border-cinza-claro focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-vekta" title="Fechar menu" aria-label="Fechar menu">
        <iconify-icon noobserver icon="lucide:x" class="text-[18px]" aria-hidden="true"></iconify-icon>
      </button>
    </div>

    <!-- Navegação preenchida em runtime pelo roteador a partir de /api/paginas. -->
    <nav id="nav-abas" class="flex flex-1 min-h-0 flex-col gap-1 overflow-y-auto p-3" aria-label="Seções"></nav>

    <div class="rail-rodape shrink-0 border-t border-linha p-3">
      <div class="flex items-center gap-2">
        <button type="button" id="botao-config" class="hidden shrink-0 inline-flex items-center justify-center w-10 h-10 rounded-xl border border-linha text-cinza transition-colors hover:bg-fundo hover:text-tinta hover:border-cinza-claro focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-vekta data-[aberto]:border-vekta data-[aberto]:text-vekta data-[aberto]:bg-vekta-suave data-[ativo]:border-vekta data-[ativo]:text-vekta data-[ativo]:bg-vekta-suave [&[data-aberto]_iconify-icon]:rotate-45" title="Configurações" aria-label="Configurações" aria-expanded="false" aria-haspopup="dialog">
          <iconify-icon noobserver icon="lucide:settings" class="text-[20px] transition-transform duration-300" aria-hidden="true"></iconify-icon>
        </button>

        <button type="button" id="botao-sair" class="hidden min-w-0 flex-1 inline-flex items-center justify-center gap-2.5 rounded-xl border border-linha px-3.5 py-2.5 text-sm font-medium text-cinza transition-colors hover:bg-fundo hover:text-tinta hover:border-cinza-claro focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-vekta" title="Sair" aria-label="Sair">
          <iconify-icon noobserver icon="lucide:log-out" class="text-[18px] shrink-0" aria-hidden="true"></iconify-icon>
          <span class="rail-rotulo">Sair</span>
        </button>
      </div>
    </div>
  </aside>

  <!-- Fundo escuro atrás do menu mobile; clicar fecha. -->
  <div id="menu-overlay" class="hidden fixed inset-0 z-10 bg-black/50 md:hidden" aria-hidden="true"></div>

  <!-- Cada página (Chat, Visão geral, DNA, Galeria…) mora em src/views/paginas/*.html
       + *.js, servido em /views/ (ver src/app.js), e é montada aqui em tempo de
       execução pelo roteador (ver src/views/.core/roteador.js). O chat é uma
       UI única (#chat-host) que migra entre a aba Chat e o painel da Visão geral. -->
  <main class="relative z-[1] flex-1 min-w-0 min-h-0 overflow-hidden flex flex-col" id="paginas"></main>

  <!-- Lightbox / preview de arquivo -->
  <div id="veu" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-8 max-md:p-3 z-50">
    <div class="bg-superficie rounded-2xl max-w-240 max-h-full w-full flex flex-col overflow-hidden shadow-2xl">
      <header class="flex items-center justify-between gap-4 px-5 py-3.5 border-b border-linha">
        <code id="modal-caminho" class="font-mono text-xs text-cinza overflow-hidden text-ellipsis whitespace-nowrap"></code>
        <div class="flex gap-2 shrink-0">
          <button id="modal-revelar" class="inline-flex items-center gap-2 px-4 py-2 border border-linha rounded-full bg-superficie text-sm font-medium text-tinta transition-colors hover:border-cinza-claro focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-vekta">Abrir no Explorer</button>
          <button id="modal-fechar" aria-label="Fechar" class="inline-flex items-center gap-2 px-4 py-2 border border-linha rounded-full bg-superficie text-sm font-medium text-tinta transition-colors hover:border-cinza-claro focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-vekta">✕</button>
        </div>
      </header>
      <div id="modal-corpo" class="overflow-auto p-5"></div>
    </div>
  </div>

  <div id="cursor" class="cursor" aria-hidden="true">
    <div class="cursor-corpo">
      <span class="cursor-braco cursor-braco-n"></span>
      <span class="cursor-braco cursor-braco-s"></span>
      <span class="cursor-braco cursor-braco-e"></span>
      <span class="cursor-braco cursor-braco-w"></span>
      <span class="cursor-vekta"></span>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/anime.min.js"></script>
  <script src="/vendor/sortable.min.js"></script>
  <script src="/vendor/chart.umd.min.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
