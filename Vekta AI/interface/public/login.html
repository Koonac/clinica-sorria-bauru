<!doctype html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar — Vekta Ai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/tailwind.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%230A0B0F'/%3E%3Ccircle cx='16' cy='16' r='10.5' fill='none' stroke='%230E8A76' stroke-width='3'/%3E%3C/svg%3E" />
  <style>
    .login-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%, rgba(14, 138, 118, 0.18), transparent 70%),
        radial-gradient(ellipse 40% 30% at 80% 80%, rgba(14, 138, 118, 0.08), transparent 60%);
    }
  </style>
</head>
<body class="h-full flex items-center justify-center bg-fundo text-tinta font-sans text-base leading-normal antialiased p-6">
  <div class="login-glow" aria-hidden="true"></div>

  <main class="relative z-[1] w-full max-w-md">
    <div class="flex flex-col items-center gap-3 mb-8">
      <div class="orbe-anel relative w-12 h-12 rounded-full" title="Vekta Ai" aria-hidden="true"></div>
      <div class="text-center">
        <h1 class="font-display text-2xl font-semibold tracking-tight">Vekta Ai</h1>
        <p class="text-sm text-cinza mt-1.5">Entre para acessar o painel</p>
      </div>
    </div>

    <form id="form-login" class="bg-superficie border border-linha rounded-2xl p-6 shadow-2xl flex flex-col gap-4" autocomplete="on">
      <div class="flex flex-col gap-1.5">
        <label for="usuario" class="text-sm font-medium text-cinza">Usuário</label>
        <input
          id="usuario"
          name="usuario"
          type="text"
          required
          autofocus
          autocomplete="username"
          class="w-full rounded-xl border border-linha bg-fundo px-4 py-3 text-tinta outline-none transition-colors focus:border-vekta focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-vekta"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="senha" class="text-sm font-medium text-cinza">Senha</label>
        <input
          id="senha"
          name="senha"
          type="password"
          required
          autocomplete="current-password"
          class="w-full rounded-xl border border-linha bg-fundo px-4 py-3 text-tinta outline-none transition-colors focus:border-vekta focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-vekta"
        />
      </div>

      <p id="erro-login" class="hidden text-sm text-alerta" role="alert"></p>

      <button
        type="submit"
        id="botao-entrar"
        class="mt-1 inline-flex items-center justify-center gap-2 rounded-xl bg-vekta px-4 py-3 text-sm font-semibold text-fundo transition-colors hover:bg-vekta-escuro focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-vekta disabled:opacity-60 disabled:cursor-not-allowed"
      >
        Entrar
      </button>
    </form>
  </main>

  <script>
    const form = document.getElementById('form-login');
    const erroEl = document.getElementById('erro-login');
    const botao = document.getElementById('botao-entrar');

    function mostrarErro(msg) {
      erroEl.textContent = msg;
      erroEl.classList.remove('hidden');
    }

    function limparErro() {
      erroEl.textContent = '';
      erroEl.classList.add('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      limparErro();
      botao.disabled = true;
      botao.textContent = 'Entrando…';

      const usuario = document.getElementById('usuario').value.trim();
      const senha = document.getElementById('senha').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ usuario, senha }),
        });

        const dados = await res.json().catch(() => ({}));

        if (!res.ok) {
          mostrarErro(dados.erro || 'Não foi possível entrar.');
          botao.disabled = false;
          botao.textContent = 'Entrar';
          return;
        }

        window.location.href = '/';
      } catch {
        mostrarErro('Falha de conexão com o servidor.');
        botao.disabled = false;
        botao.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
